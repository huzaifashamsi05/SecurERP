components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # ── Auth ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # ── Dashboard ────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - totalGuards
        - activeGuards
        - totalSites
        - activeShifts
        - todayIncidents
        - pendingLeave
        - openRecruitment
        - monthlyRevenue
        - monthlyExpenses
      properties:
        totalGuards:
          type: integer
        activeGuards:
          type: integer
        totalSites:
          type: integer
        activeShifts:
          type: integer
        todayIncidents:
          type: integer
        pendingLeave:
          type: integer
        openRecruitment:
          type: integer
        monthlyRevenue:
          type: number
        monthlyExpenses:
          type: number

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string
        entityId:
          type: ["integer", "null"]
        entityType:
          type: ["string", "null"]
        actorName:
          type: ["string", "null"]

    AttendanceOverviewItem:
      type: object
      required: [date, present, absent, late]
      properties:
        date:
          type: string
        present:
          type: integer
        absent:
          type: integer
        late:
          type: integer

    IncidentStatItem:
      type: object
      required: [type, count]
      properties:
        type:
          type: string
        count:
          type: integer

    # ── User ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, email, role, password]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        password:
          type: string
        phone:
          type: string
        status:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        phone:
          type: string
        status:
          type: string
        avatar:
          type: string

    # ── Guard ─────────────────────────────────────────────────────────────────
    Guard:
      type: object
      required: [id, userId, employeeId, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        status:
          type: string
        siteId:
          type: ["integer", "null"]
        siteName:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        photo:
          type: ["string", "null"]
        joinDate:
          type: ["string", "null"]
        createdAt:
          type: string

    GuardInput:
      type: object
      required: [name, email, employeeId]
      properties:
        name:
          type: string
        email:
          type: string
        employeeId:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
        siteId:
          type: integer
        skills:
          type: array
          items:
            type: string
        joinDate:
          type: string

    GuardUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
        siteId:
          type: integer
        skills:
          type: array
          items:
            type: string

    GuardStats:
      type: object
      required: [total, active, inactive, onLeave, onDuty]
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        onLeave:
          type: integer
        onDuty:
          type: integer

    # ── Client ─────────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, email, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        status:
          type: string
        siteCount:
          type: integer
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        contactPerson:
          type: string
        industry:
          type: string
        status:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        contactPerson:
          type: string
        industry:
          type: string
        status:
          type: string

    # ── Site ─────────────────────────────────────────────────────────────────
    Site:
      type: object
      required: [id, clientId, name, address, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        name:
          type: string
        address:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        guardCount:
          type: integer
        requiredGuards:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    SiteInput:
      type: object
      required: [clientId, name, address]
      properties:
        clientId:
          type: integer
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        requiredGuards:
          type: integer
        status:
          type: string

    SiteUpdate:
      type: object
