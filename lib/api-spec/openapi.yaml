          type: string
        latitude:
          type: number
        longitude:
          type: number
        requiredGuards:
          type: integer
        status:
          type: string

    # ── Shift ─────────────────────────────────────────────────────────────────
    Shift:
      type: object
      required: [id, guardId, siteId, startTime, endTime, status, createdAt]
      properties:
        id:
          type: integer
        guardId:
          type: integer
        guardName:
          type: ["string", "null"]
        siteId:
          type: integer
        siteName:
          type: ["string", "null"]
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ShiftInput:
      type: object
      required: [guardId, siteId, startTime, endTime]
