kind = "web"
previewPath = "/"
title = "Security Guard ERP"
version = "1.0.0"
id = "artifacts/security-erp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22164

[services.development]
run = "pnpm --filter @workspace/security-erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/security-erp", "run", "build" ]
serve = "static"
publicDir = "artifacts/security-erp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22164"
BASE_PATH = "/"
